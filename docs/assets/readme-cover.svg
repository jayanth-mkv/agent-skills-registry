  <text x="90" y="234" fill="#151515" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700">Agent Skills Registry</text>
  <text x="94" y="300" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="29">Production-ready agent skills, validated before every merge.</text>
