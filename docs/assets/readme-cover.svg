  <g transform="translate(92 72)">
    <rect x="0" y="0" width="58" height="68" fill="#F4F0E7" stroke="#151515" stroke-width="3"/>
    <rect x="8" y="8" width="58" height="68" fill="#E4DED2" stroke="#151515" stroke-width="3"/>
    <path d="M18 30h38M18 43h30M18 56h34" stroke="#151515" stroke-width="3"/>
