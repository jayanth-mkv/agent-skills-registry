  <text x="122" y="444" fill="#F4F0E7" font-family="'Courier New', monospace" font-size="21">npx skills add jayanth-mkv/agent-skills-registry</text>
  <text x="95" y="550" fill="#69655E" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="5">SPEC-VALIDATED / CLI-DISCOVERED / SELECTIVE</text>
  <rect x="1040" y="397" width="66" height="74" fill="#B54A32"/>
