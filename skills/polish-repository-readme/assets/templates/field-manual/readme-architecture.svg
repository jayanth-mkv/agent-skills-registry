  <circle cx="700" cy="338" r="48" fill="#A4773F"/>
  <g font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="700" text-anchor="middle"><text x="240" y="351" fill="#1D1A17">01</text><text x="700" y="351" fill="#F7F2E8">02</text><text x="1160" y="351" fill="#1D1A17">03</text></g>
  <g fill="#1D1A17" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle"><text x="240" y="238">Observe source</text><text x="700" y="238">Process context</text><text x="1160" y="238">Review result</text></g>
  <g fill="#7A644B" font-family="Courier New, monospace" font-size="14" text-anchor="middle"><text x="240" y="442">SIGNALS + HISTORY</text><text x="700" y="442">SERVICE + DECISION LOGIC</text><text x="1160" y="442">EVIDENCE + CONTROL</text></g>
  <g font-family="Courier New, monospace" font-size="13">
    <rect x="78" y="478" width="324" height="56" fill="#FFFFFF" stroke="#D7C9B3" stroke-width="2"/><text x="240" y="512" fill="#1D1A17" text-anchor="middle">verified data boundary</text>
    <rect x="538" y="478" width="324" height="56" fill="#1D1A17"/><text x="700" y="512" fill="#F7F2E8" text-anchor="middle">implemented core</text>
