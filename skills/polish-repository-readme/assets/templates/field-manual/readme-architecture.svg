<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Industrial field manual architecture seed</title>
  <desc id="desc">A three-station operations rail with explicit system boundaries and review status.</desc>
  <rect width="1400" height="720" fill="#F7F2E8"/>
  <rect x="28" y="28" width="1344" height="664" fill="none" stroke="#1D1A17" stroke-width="2"/>
  <rect x="28" y="28" width="10" height="664" fill="#A4773F"/>
  <text x="70" y="78" fill="#875C2C" font-family="Courier New, monospace" font-size="14" font-weight="700" letter-spacing="2.5">PROJECT / OPERATIONS RAIL 01</text>
  <text x="70" y="142" fill="#1D1A17" font-family="Georgia, Times New Roman, serif" font-size="50" font-weight="700">Observe. Process. Review.</text>
  <text x="1330" y="136" fill="#7A644B" font-family="Courier New, monospace" font-size="13" text-anchor="end">REPLACE WITH THE ACTUAL CONTROL BOUNDARY</text>
