<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Classic editorial architecture seed</title>
  <desc id="desc">A warm-white paper-and-ink architecture composition with implemented and optional paths.</desc>
